[project]
name = "pdf-form-proof"
version = "0.1.2"
description = "Fill fillable PDF forms, then prove every value is visible on the rendered page. MCP server and CLI."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eric Brakebill-Jones" }]
keywords = ["pdf", "pdf-form", "acroform", "form-filling", "mcp", "ocr", "verification", "nonprofit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business",
]
dependencies = [
  "mcp>=1.10,<2",
  "pypdf>=4.0",
  "pillow>=10.0",
]

[project.urls]
Homepage = "https://github.com/EssenceAlignment/pdf-form-proof"
Issues = "https://github.com/EssenceAlignment/pdf-form-proof/issues"

[project.scripts]
pdf-form-proof = "pdf_form_proof.server:main"
pdf-form-inspect = "pdf_form_proof.cli:inspect_main"
pdf-form-fill = "pdf_form_proof.cli:fill_main"
pdf-form-verify = "pdf_form_proof.legibility:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_form_proof"]
